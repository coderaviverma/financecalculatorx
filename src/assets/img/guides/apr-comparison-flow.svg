<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">How the interest rate and fees combine into APR</title>
  <desc id="desc">For a twenty thousand dollar loan, the interest rate determines the scheduled payment while an eight hundred dollar fee reduces the cash received to nineteen thousand two hundred dollars. APR compares the payment stream with the cash actually received.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#0b6b57"/>
    </marker>
    <style>
      .title{font:600 22px Inter,system-ui,sans-serif;fill:#182420}.label{font:600 14px Inter,system-ui,sans-serif;fill:#46554e}.value{font:700 19px Inter,system-ui,sans-serif;fill:#0a5245}.small{font:500 13px Inter,system-ui,sans-serif;fill:#46554e}.box{fill:#fff;stroke:#c4cec9;stroke-width:1.5}.accent{fill:#edf5f2;stroke:#0b6b57;stroke-width:1.5}.gold{fill:#f5ebd8;stroke:#9a6a14;stroke-width:1.5}.flow{fill:none;stroke:#0b6b57;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="358" rx="14" fill="#f5f7f6" stroke="#dce3df"/>
  <text x="380" y="39" text-anchor="middle" class="title">Why APR can be higher than the interest rate</text>

  <rect x="28" y="122" width="146" height="92" rx="11" class="box"/>
  <text x="101" y="150" text-anchor="middle" class="label">Loan amount</text>
  <text x="101" y="180" text-anchor="middle" class="value">$20,000</text>
  <text x="101" y="201" text-anchor="middle" class="small">60-month offer</text>

  <path d="M174 157H216V100H246" class="flow"/>
  <rect x="250" y="65" width="190" height="82" rx="11" class="accent"/>
  <text x="345" y="91" text-anchor="middle" class="label">Interest rate: 5.9%</text>
  <text x="345" y="119" text-anchor="middle" class="value">Payment $385.73</text>
  <text x="345" y="138" text-anchor="middle" class="small">sets the schedule</text>

  <path d="M174 178H216V240H246" class="flow"/>
  <rect x="250" y="199" width="190" height="82" rx="11" class="gold"/>
  <text x="345" y="225" text-anchor="middle" class="label">Included fee: $800</text>
  <text x="345" y="253" text-anchor="middle" class="value">$19,200 received</text>
  <text x="345" y="272" text-anchor="middle" class="small">$20,000 − $800</text>

  <path d="M440 106H484V155H514" class="flow"/>
  <path d="M440 240H484V181H514" class="flow"/>
  <rect x="518" y="114" width="214" height="108" rx="11" class="accent"/>
  <text x="625" y="142" text-anchor="middle" class="label">APR connects both</text>
  <text x="625" y="175" text-anchor="middle" class="value">7.61%</text>
  <text x="625" y="197" text-anchor="middle" class="small">payments measured against</text>
  <text x="625" y="214" text-anchor="middle" class="small">the money actually received</text>

  <rect x="122" y="306" width="516" height="32" rx="16" fill="#e4eae7"/>
  <text x="380" y="327" text-anchor="middle" class="small">Use APR for like-for-like offers; use total cost for different terms or early payoff.</text>
</svg>
